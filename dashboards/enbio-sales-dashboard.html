*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;max-width:1360px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;padding-block:18px 10px}
header.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.frow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.flabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg2);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.chip:focus-visible,select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number]{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg2);padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;font-size:14px;color:var(--fg2);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.view{display:flex;flex-direction:column;gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:12.5px;color:var(--fg2);margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 2px}
.card .note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chart{position:relative;width:100%;height:300px}
.chart.tall{height:360px}
.chart.small{height:170px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
tr.tot td{font-weight:600;border-top:1px solid var(--line)}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--accent-soft)}
td.dim{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--fg2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.box{height:10px;width:10px;border-radius:2px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--accent-soft);color:var(--fg2);margin-left:6px;vertical-align:middle}
.foot{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
input.g{width:72px;text-align:right}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
@media (max-width:600px){ .flabel{min-width:100%} .tile .v{font-size:22px} .chart{height:240px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

function fmt(v, m=S.metric){ if(v==null) return "–"; if(m==="q") return fmtInt.format(v); const u = m==="e"?"€":"zł"; return fmtInt.format(v)+" "+u; }
function fmtC(v, m=S.metric){ if(v==null) return "–"; const a=Math.abs(v); if(m==="q") return fmtInt.format(v); const u=m==="e"?" €":" zł"; if(a>=1e6) return (v/1e6).toFixed(2).replace(".",",")+" mln"+u; if(a>=1e4) return (v/1e3).toFixed(0)+" tys."+u; return fmtInt.format(v)+u; }
const MI = {q:7,e:8,p:9};
const metricName = ()=>({q:"sztuki",e:"netto EUR",p:"netto PLN"})[S.metric];

// ---------- data slicing ----------
function slice(opt={}){
  const comp = opt.comp||S.comp, prod = opt.prod||S.prod, dt = opt.dt||S.dt, country = opt.country!==undefined?opt.country:S.country;
  return D.rows.filter(r => comp.has(r[2]) && prod.has(r[4]) && dt.has(r[6]) && (country<0 || r[3]===country));
}
function monthly(rows, year, mi=MI[S.metric]){ const a=new Array(12).fill(0); for(const r of rows) if(r[0]===year) a[r[1]-1]+=r[mi]; return a; }
function sumTo(a, m){ let s=0; for(let i=0;i<m;i++) s+=a[i]; return s; }
function yearTotal(rows, y, win){ const a=monthly(rows,y); return sumTo(a, win||12); }
function yoy(cur, prev){ if(!prev) return null; return (cur-prev)/Math.abs(prev)*100; }
function groupSum(rows, keyFn, mi=MI[S.metric]){ const m=new Map(); for(const r of rows){ const k=keyFn(r); m.set(k,(m.get(k)||0)+r[mi]); } return m; }
// comparison window: when YTD is on and the main year is the current one, compare months through the last full month
function win(y){ return (S.ytd && S.mainYear===CUR_Y) ? LAST_FULL_M : 12; }
function winLabel(){ return (S.ytd && S.mainYear===CUR_Y) ? ` (I–${["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"][LAST_FULL_M-1]})` : ""; }

// ---------- charts ----------
const charts=[];
function destroyCharts(){ while(charts.length) charts.pop().destroy(); }
function baseOpts(extra={}){
  const fg=cssv("--fg2"), grid=cssv("--grid");
  Chart.defaults.font.family = cssv("--font") || "system-ui";
  Chart.defaults.color = fg;
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:"index", intersect:false},
    plugins:{ legend:{display:false}, tooltip:{ backgroundColor:cssv("--panel"), titleColor:cssv("--fg"), bodyColor:cssv("--fg"), borderColor:cssv("--line"), borderWidth:1, padding:10, boxPadding:4, usePointStyle:true,
      callbacks:{ label:(c)=> ` ${c.dataset.label}: ${fmt(c.parsed.y ?? c.parsed.x)}` } } },
    scales:{ x:{grid:{display:false}, border:{color:cssv("--line")}, ticks:{color:cssv("--muted")}},
             y:{grid:{color:grid}, border:{display:false}, ticks:{color:cssv("--muted"), callback:v=> S.metric==="q"? fmtInt.format(v) : (Math.abs(v)>=1e6? (v/1e6).toFixed(1).replace(".",",")+" mln" : Math.abs(v)>=1e3 ? (v/1e3).toFixed(0)+" tys." : v)}, beginAtZero:true} },
    ...extra };
}
function lineDs(label, data, color, bold=false){ return {label, data, borderColor:color, backgroundColor:color, borderWidth:bold?3:2, pointRadius:bold?4:3, pointHoverRadius:6, pointBackgroundColor:color, pointBorderColor:cssv("--panel"), pointBorderWidth:2, tension:0.25, spanGaps:false}; }
function barDs(label, data, color, stack){ return {label, data, backgroundColor:color, borderColor:cssv("--panel"), borderWidth:{top:0,bottom:0,left:1,right:1}, borderRadius:3, borderSkipped:"bottom", maxBarThickness:24, stack}; }
function mkChart(el, cfg){ const c=new Chart(el.querySelector("canvas"), cfg); charts.push(c); return c; }
function yearColor(y){ const idx = YEARS.indexOf(y); const n=YEARS.length; const slot = Math.max(1, Math.min(6, 6 - (n-1-idx))); return cssv("--y"+slot); }
function legendHTML(items){ return `<div class="legend">${items.map(i=>`<span><i class="${i.box?'box':''}" style="background:${i.color}"></i>${esc(i.label)}</span>`).join("")}</div>`; }
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- filter UI ----------
function chipRow(container, items, isOn, onToggle, extra){
  container.innerHTML="";
  items.forEach((it,i)=>{ const b=document.createElement("button"); b.className="chip"; b.type="button"; b.setAttribute("aria-pressed", isOn(i)?"true":"false");
    if(it.color) b.innerHTML=`<span class="sw" style="background:${it.color}"></span>`; b.appendChild(document.createTextNode(it.label));
    b.addEventListener("click", e=>{ onToggle(i, e.altKey||e.metaKey||e.ctrlKey); render(); }); container.appendChild(b); });
  if(extra) extra.forEach(x=>{ const b=document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=x.label; b.style.borderStyle="dashed"; b.addEventListener("click",()=>{x.fn(); render();}); container.appendChild(b); });
}
function toggleSet(set, i, solo, all){ if(solo){ set.clear(); set.add(i); return; } if(set.has(i)){ if(set.size>1) set.delete(i); } else set.add(i); }
function buildFilters(){
  chipRow(document.getElementById("f-years"), YEARS.map(y=>({label:String(y), color:yearColor(y)})), i=>S.years.includes(YEARS[i]),
    (i,solo)=>{ const y=YEARS[i]; if(solo){S.years=[y];} else if(S.years.includes(y)){ if(S.years.length>1) S.years=S.years.filter(v=>v!==y);} else S.years=[...S.years,y].sort(); if(!S.years.includes(S.mainYear)) S.mainYear=S.years[S.years.length-1]; });
  chipRow(document.getElementById("f-comp"), D.companies.map((c,i)=>({label:c, color:cssv(COMP_COLORS[i]||"--c4")})), i=>S.comp.has(i), (i,solo)=>toggleSet(S.comp,i,solo),
    [{label:"wszystkie", fn:()=>{S.comp=new Set(D.companies.map((_,i)=>i));}}]);
  chipRow(document.getElementById("f-prod"), D.products.map(p=>({label:p, color:cssv(PRODUCT_COLORS[p]||"--c8")})), i=>S.prod.has(i), (i,solo)=>toggleSet(S.prod,i,solo),
    [{label:"wszystkie", fn:()=>{S.prod=new Set(D.products.map((_,i)=>i));}},
     {label:"tylko autoklawy", fn:()=>{S.prod=new Set(D.products.map((p,i)=>[p,i]).filter(([p])=>/Enbio S|Enbio PRO|Enbio Beauty|Refurb/.test(p)).map(([,i])=>i));}},
     {label:"tylko nowe", fn:()=>{S.prod=new Set(D.products.map((p,i)=>[p,i]).filter(([p])=>!isRefurb(p)).map(([,i])=>i));}},
     {label:"tylko refurb", fn:()=>{S.prod=new Set(D.products.map((p,i)=>[p,i]).filter(([p])=>isRefurb(p)).map(([,i])=>i));}}]);
  chipRow(document.getElementById("f-dt"), D.dtypes.map(d=>({label:d})), i=>S.dt.has(i), (i,solo)=>toggleSet(S.dt,i,solo));
  const sel=document.getElementById("f-country");
  const totals = groupSum(D.rows, r=>r[3], 7);
  const order = D.countries.map((c,i)=>i).sort((a,b)=>(totals.get(b)||0)-(totals.get(a)||0));
  sel.innerHTML = `<option value="-1">Wszystkie kraje</option>` + order.map(i=>`<option value="${i}">${esc(D.countries[i])} (${fmtInt.format(totals.get(i)||0)} szt.)</option>`).join("");
  sel.value=String(S.country);
  sel.onchange=()=>{ S.country=+sel.value; render(); };
  document.getElementById("f-metric").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.metric=b.dataset.v; render(); });
  document.getElementById("f-ytd").onchange=e=>{ S.ytd=e.target.checked; render(); };
  document.getElementById("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; render(); });
}
function syncFilterUI(){
  document.getElementById("f-years").querySelectorAll(".chip").forEach((b,i)=>{ if(i<YEARS.length) b.setAttribute("aria-pressed", S.years.includes(YEARS[i])?"true":"false"); });
  document.getElementById("f-comp").querySelectorAll(".chip").forEach((b,i)=>{ if(i<D.companies.length) b.setAttribute("aria-pressed", S.comp.has(i)?"true":"false"); });
  document.getElementById("f-prod").querySelectorAll(".chip").forEach((b,i)=>{ if(i<D.products.length) b.setAttribute("aria-pressed", S.prod.has(i)?"true":"false"); });
  document.getElementById("f-dt").querySelectorAll(".chip").forEach((b,i)=>{ if(i<D.dtypes.length) b.setAttribute("aria-pressed", S.dt.has(i)?"true":"false"); });
  document.getElementById("f-metric").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.metric?"true":"false"));
  document.getElementById("f-ytd").checked=S.ytd;
  document.getElementById("f-country").value=String(S.country);
  document.getElementById("tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===S.tab?"true":"false"));
  const parts=[]; if(S.comp.size<D.companies.length) parts.push([...S.comp].map(i=>D.companies[i]).join(", ")); else parts.push("wszystkie spółki");
  if(S.country>=0) parts.push(D.countries[S.country]); else parts.push("wszystkie kraje");
  if(S.prod.size<D.products.length) parts.push(S.prod.size+" z "+D.products.length+" produktów"); else parts.push("wszystkie produkty");
  document.getElementById("subtitle").textContent = `${metricName()} · ${parts.join(" · ")} · dane do ${D.maxDate}`;
}

// ---------- shared pieces ----------
function mainYearSelect(){ return `<label style="font-size:12.5px;color:var(--fg2)">Rok główny <select id="mainYear">${S.years.map(y=>`<option value="${y}" ${y===S.mainYear?"selected":""}>${y}</option>`).join("")}</select></label>`; }
function bindMainYear(){ const el=document.getElementById("mainYear"); if(el) el.onchange=()=>{ S.mainYear=+el.value; render(); }; }
function yoyCell(v){ return `<td class="${v==null?'dim':v>=0?'up':'down'}">${fmtPct(v)}</td>`; }
function partialNote(){ return (S.ytd && S.mainYear===CUR_Y) ? `Porównania r/r dla ${CUR_Y} liczone za ten sam okres poprzedniego roku${winLabel()}; ${MONL[CUR_M-1]} ${CUR_Y} jest miesiącem w toku i jest pominięty w porównaniach.` : `Porównania r/r za pełne lata.`; }

// ---------- views ----------
function viewOverview(rows){
  const Y=S.mainYear, P=Y-1, w = (S.ytd && Y===CUR_Y) ? LAST_FULL_M : 12;
  const cur = yearTotal(rows,Y,w), prev = yearTotal(rows,P,w);
  const curQ = sumTo(monthly(rows,Y,7),w), prevQ = sumTo(monthly(rows,P,7),w);
  const curE = sumTo(monthly(rows,Y,8),w), prevE = sumTo(monthly(rows,P,8),w);
  const refQ = sumTo(monthly(rows.filter(r=>isRefurb(D.products[r[4]])),Y,7),w), refQp = sumTo(monthly(rows.filter(r=>isRefurb(D.products[r[4]])),P,7),w);
  const autoQ = sumTo(monthly(rows.filter(r=>/Enbio S|Enbio PRO|Enbio Beauty|Refurb/.test(D.products[r[4]])),Y,7),w), autoQp = sumTo(monthly(rows.filter(r=>/Enbio S|Enbio PRO|Enbio Beauty|Refurb/.test(D.products[r[4]])),P,7),w);
  const tiles = [
    {l:`Sztuki ${Y}${winLabel()}`, v:fmtInt.format(curQ), d:yoy(curQ,prevQ), dd:`vs ${fmtInt.format(prevQ)} w ${P}`},
    {l:`Netto EUR ${Y}${winLabel()}`, v:fmtC(curE,"e"), d:yoy(curE,prevE), dd:`vs ${fmtC(prevE,"e")} w ${P}`},
    {l:`Autoklawy (nowe + refurb)`, v:fmtInt.format(autoQ), d:yoy(autoQ,autoQp), dd:`vs ${fmtInt.format(autoQp)} w ${P}`},
    {l:`W tym refurb`, v:fmtInt.format(refQ), d:yoy(refQ,refQp), dd:`${autoQ? (refQ/autoQ*100).toFixed(1).replace(".",","):"0"}% autoklawów`},
    {l:`Śr. cena netto / szt.`, v: curQ? fmtC(curE/curQ,"e"):"–", d: (curQ&&prevQ)? yoy(curE/curQ, prevE/prevQ):null, dd:`vs ${prevQ? fmtC(prevE/prevQ,"e"):"–"} w ${P}`},
  ];
  let h = `<div class="frow" style="justify-content:space-between">${mainYearSelect()}<span class="note" style="margin:0">${partialNote()}</span></div>`;
  h += `<div class="tiles">${tiles.map(t=>`<div class="tile"><div class="l">${t.l}</div><div class="v">${t.v}</div><div class="d"><span class="${t.d==null?'':t.d>=0?'up':'down'}">${fmtPct(t.d)}</span> ${esc(t.dd)}</div></div>`).join("")}</div>`;
  h += `<div class="card"><h2>Sprzedaż miesięczna rok do roku</h2><p class="note">${metricName()} · każda linia to jeden rok; najciemniejsza linia = rok główny</p>${legendHTML(S.years.map(y=>({label:String(y),color:yearColor(y)})))}<div class="chart tall" id="ch-months"><canvas></canvas></div></div>`;
  // month x year table
  h += `<div class="card"><h2>Tabela miesięczna</h2><p class="note">${metricName()} · r/r = ${Y} vs ${P}</p><div class="tbl"><table><thead><tr><th>Miesiąc</th>${S.years.map(y=>`<th>${y}</th>`).join("")}<th>r/r ${Y}</th></tr></thead><tbody>`;
  const ms = S.years.map(y=>monthly(rows,y));
  for(let m=0;m<12;m++){ const c=ms[S.years.indexOf(Y)]?.[m], p=ms[S.years.indexOf(P)]?.[m]; const partial = (Y===CUR_Y && m+1===CUR_M);
    h += `<tr><td>${MONL[m]}${partial?'<span class="badge">w toku</span>':''}</td>${S.years.map((y,i)=>`<td class="${(y>CUR_Y||(y===CUR_Y&&m+1>CUR_M))?'dim':''}">${(y>CUR_Y||(y===CUR_Y&&m+1>CUR_M))?'':fmt(ms[i][m])}</td>`).join("")}${(partial || (Y===CUR_Y && m+1>CUR_M))? '<td class="dim">–</td>' : yoyCell(S.years.includes(P)? yoy(c,p) : yoy(c, monthly(rows,P)[m]))}</tr>`; }
  h += `<tr class="tot"><td>Suma</td>${S.years.map((y,i)=>`<td>${fmt(ms[i].reduce((a,b)=>a+b,0))}</td>`).join("")}${yoyCell(yoy(cur,prev))}</tr></tbody></table></div></div>`;
  // YoY by year tiles
  h += `<div class="card"><h2>Dynamika rok do roku (pełne lata)</h2><p class="note">${metricName()} · suma roczna i zmiana względem roku poprzedniego · dla ${CUR_Y} r/r liczone za I–${LAST_FULL_M} obu lat</p><div class="tbl"><table><thead><tr><th>Rok</th><th>Sztuki</th><th>r/r</th><th>Netto EUR</th><th>r/r</th><th>Śr. cena €</th><th>Udział refurb</th></tr></thead><tbody>`;
  let pq=null, pe=null;
  for(const y of YEARS){ const q=monthly(rows,y,7).reduce((a,b)=>a+b,0), e=monthly(rows,y,8).reduce((a,b)=>a+b,0); const rq=monthly(rows.filter(r=>isRefurb(D.products[r[4]])),y,7).reduce((a,b)=>a+b,0); const aq=monthly(rows.filter(r=>/Enbio S|Enbio PRO|Enbio Beauty|Refurb/.test(D.products[r[4]])),y,7).reduce((a,b)=>a+b,0);
    const cur = y===CUR_Y; const qc = cur? sumTo(monthly(rows,y,7),LAST_FULL_M):q, ec = cur? sumTo(monthly(rows,y,8),LAST_FULL_M):e; const qp = cur? sumTo(monthly(rows,y-1,7),LAST_FULL_M):pq, ep = cur? sumTo(monthly(rows,y-1,8),LAST_FULL_M):pe;
    h += `<tr><td>${y}${cur?'<span class="badge">do '+D.maxDate+'</span>':''}</td><td>${fmtInt.format(q)}</td>${yoyCell(yoy(qc,qp))}<td>${fmtC(e,"e")}</td>${yoyCell(yoy(ec,ep))}<td>${q? fmtC(e/q,"e"):"–"}</td><td>${aq? (rq/aq*100).toFixed(1).replace(".",",")+"%":"–"}</td></tr>`; pq=q; pe=e; }
  h += `</tbody></table></div></div>`;
  return {html:h, after:()=>{ bindMainYear();
    const ds = S.years.map(y=>{ const d=monthly(rows,y).map((v,i)=> (y>CUR_Y||(y===CUR_Y&&i+1>CUR_M))? null : v); return lineDs(String(y), d, yearColor(y), y===Y); });
    mkChart(document.getElementById("ch-months"), {type:"line", data:{labels:MON, datasets:ds}, options:baseOpts()});
  }};
}

function viewProducts(rows){
  const Y=S.mainYear, P=Y-1;
  const prods = D.products.map((p,i)=>i).filter(i=>S.prod.has(i));
  let h = `<div class="frow" style="justify-content:space-between">${mainYearSelect()}<span class="note" style="margin:0">${partialNote()}</span></div>`;
  h += `<div class="card"><h2>Produkty rok do roku</h2><p class="note">${metricName()} · pełne lata (${CUR_Y} do ${D.maxDate}) · r/r porównuje ${Y} z ${P}${winLabel()}</p><div class="tbl"><table><thead><tr><th>Produkt</th>${S.years.map(y=>`<th>${y}</th>`).join("")}<th>r/r ${Y}</th><th>Udział ${Y}</th></tr></thead><tbody>`;
  const totY = yearTotal(rows,Y, win(Y));
  const totalsByYear = S.years.map(()=>0);
  for(const pi of prods){ const pr = rows.filter(r=>r[4]===pi); const vals=S.years.map(y=>monthly(pr,y).reduce((a,b)=>a+b,0)); vals.forEach((v,i)=>totalsByYear[i]+=v);
    const c=yearTotal(pr,Y,win(Y)), p=yearTotal(pr,P,win(Y));
    h += `<tr><td><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cssv(PRODUCT_COLORS[D.products[pi]]||"--c8")};margin-right:6px"></span>${esc(D.products[pi])}</td>${vals.map(v=>`<td>${fmt(v)}</td>`).join("")}${yoyCell(yoy(c,p))}<td>${totY? (c/totY*100).toFixed(1).replace(".",",")+"%":"–"}</td></tr>`; }
  h += `<tr class="tot"><td>Suma</td>${totalsByYear.map(v=>`<td>${fmt(v)}</td>`).join("")}${yoyCell(yoy(totY, yearTotal(rows,P,win(Y))))}<td>100%</td></tr></tbody></table></div></div>`;
  h += `<div class="card"><h2>Produkty wg lat</h2><p class="note">${metricName()} · słupki pogrupowane po produkcie, kolor = rok</p>${legendHTML(S.years.map(y=>({label:String(y),color:yearColor(y),box:true})))}<div class="chart tall" id="ch-prod"><canvas></canvas></div></div>`;
  h += `<div class="card"><h2>Miesięczny przebieg każdego produktu</h2><p class="note">${metricName()} · każdy wykres: miesiące na osi, linia = rok</p><div class="grid3">` + prods.map(pi=>`<div><div style="font-size:13px;font-weight:600;margin-bottom:4px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cssv(PRODUCT_COLORS[D.products[pi]]||"--c8")};margin-right:6px"></span>${esc(D.products[pi])}</div><div class="chart small" id="ch-p-${pi}"><canvas></canvas></div></div>`).join("") + `</div></div>`;
  return {html:h, after:()=>{ bindMainYear();
    mkChart(document.getElementById("ch-prod"), {type:"bar", data:{labels:prods.map(i=>D.products[i]), datasets:S.years.map(y=>barDs(String(y), prods.map(pi=>monthly(rows.filter(r=>r[4]===pi),y).reduce((a,b)=>a+b,0)), yearColor(y)))}, options:baseOpts()});
    for(const pi of prods){ const pr=rows.filter(r=>r[4]===pi); const o=baseOpts(); o.scales.x.ticks.font={size:10}; o.scales.y.ticks.font={size:10}; o.plugins.tooltip.callbacks.title=(items)=>MONL[items[0].dataIndex];
      mkChart(document.getElementById("ch-p-"+pi), {type:"line", data:{labels:MON, datasets:S.years.map(y=>{ const d=lineDs(String(y), monthly(pr,y).map((v,i)=>(y>CUR_Y||(y===CUR_Y&&i+1>CUR_M))?null:v), yearColor(y), y===Y); d.pointRadius=2; d.borderWidth=y===Y?2.5:1.5; return d; })}, options:o}); }
  }};
}

function viewCompanies(rows){
  const Y=S.mainYear, P=Y-1;
  const comps = D.companies.map((c,i)=>i).filter(i=>S.comp.has(i));
  let h = `<div class="frow" style="justify-content:space-between">${mainYearSelect()}<span class="note" style="margin:0">${partialNote()}</span></div>`;
  h += `<div class="card"><h2>Spółki rok do roku</h2><p class="note">${metricName()} · r/r porównuje ${Y} z ${P}${winLabel()}</p><div class="tbl"><table><thead><tr><th>Spółka</th>${S.years.map(y=>`<th>${y}</th>`).join("")}<th>r/r ${Y}</th><th>Udział ${Y}</th></tr></thead><tbody>`;
  const totY=yearTotal(rows,Y,win(Y)); const tby=S.years.map(()=>0);
  for(const ci of comps){ const cr=rows.filter(r=>r[2]===ci); const vals=S.years.map(y=>monthly(cr,y).reduce((a,b)=>a+b,0)); vals.forEach((v,i)=>tby[i]+=v); const c=yearTotal(cr,Y,win(Y)), p=yearTotal(cr,P,win(Y));
    h += `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cssv(COMP_COLORS[ci]||"--c4")};margin-right:6px"></span>${esc(D.companies[ci])}</td>${vals.map(v=>`<td>${fmt(v)}</td>`).join("")}${yoyCell(yoy(c,p))}<td>${totY?(c/totY*100).toFixed(1).replace(".",",")+"%":"–"}</td></tr>`; }
  h += `<tr class="tot"><td>Suma</td>${tby.map(v=>`<td>${fmt(v)}</td>`).join("")}${yoyCell(yoy(totY,yearTotal(rows,P,win(Y))))}<td>100%</td></tr></tbody></table></div></div>`;
  h += `<div class="card"><h2>Miesiące ${Y} wg spółki</h2><p class="note">${metricName()} · słupki skumulowane, kolor = spółka</p>${legendHTML(comps.map(ci=>({label:D.companies[ci],color:cssv(COMP_COLORS[ci]||"--c4"),box:true})))}<div class="chart tall" id="ch-comp"><canvas></canvas></div></div>`;
  h += `<div class="card"><h2>Tabela: miesiąc × spółka, ${Y} (w nawiasie ${P})</h2><p class="note">${metricName()}</p><div class="tbl"><table><thead><tr><th>Miesiąc</th>${comps.map(ci=>`<th>${esc(D.companies[ci])}</th>`).join("")}<th>Razem</th><th>r/r</th></tr></thead><tbody>`;
  const cm = comps.map(ci=>monthly(rows.filter(r=>r[2]===ci),Y)), pm = comps.map(ci=>monthly(rows.filter(r=>r[2]===ci),P));
  for(let m=0;m<12;m++){ if(Y===CUR_Y && m+1>CUR_M) break; const t=cm.reduce((a,c)=>a+c[m],0), tp=pm.reduce((a,c)=>a+c[m],0);
    h += `<tr><td>${MONL[m]}${(Y===CUR_Y&&m+1===CUR_M)?'<span class="badge">w toku</span>':''}</td>${cm.map((c,i)=>`<td>${fmt(c[m])} <span class="dim" style="color:var(--muted);font-size:11px">(${fmt(pm[i][m])})</span></td>`).join("")}<td><b>${fmt(t)}</b></td>${yoyCell(yoy(t,tp))}</tr>`; }
  h += `</tbody></table></div></div>`;
  h += `<div class="card"><h2>Przebieg spółek w czasie</h2><p class="note">${metricName()} · suma roczna każdej spółki (${CUR_Y} do ${D.maxDate})</p>${legendHTML(comps.map(ci=>({label:D.companies[ci],color:cssv(COMP_COLORS[ci]||"--c4")})))}<div class="chart" id="ch-comp-y"><canvas></canvas></div></div>`;
  return {html:h, after:()=>{ bindMainYear();
    const o=baseOpts(); o.scales.x.stacked=true; o.scales.y.stacked=true;
    mkChart(document.getElementById("ch-comp"), {type:"bar", data:{labels:MON, datasets:comps.map(ci=>barDs(D.companies[ci], monthly(rows.filter(r=>r[2]===ci),Y).map((v,i)=>(Y===CUR_Y&&i+1>CUR_M)?null:v), cssv(COMP_COLORS[ci]||"--c4"), "s"))}, options:o});
    mkChart(document.getElementById("ch-comp-y"), {type:"line", data:{labels:YEARS.map(String), datasets:comps.map(ci=>lineDs(D.companies[ci], YEARS.map(y=>monthly(rows.filter(r=>r[2]===ci),y).reduce((a,b)=>a+b,0)), cssv(COMP_COLORS[ci]||"--c4")))}, options:baseOpts()});
  }};
}

function viewCountries(rows){
  const Y=S.mainYear, P=Y-1, w=win(Y);
  let h = `<div class="frow" style="justify-content:space-between">${mainYearSelect()}<span class="note" style="margin:0">${partialNote()} Kliknij kraj, aby ustawić filtr.</span></div>`;
  const byC = new Map(); for(const r of D.rows){ if(!S.comp.has(r[2])||!S.prod.has(r[4])||!S.dt.has(r[6])) continue; if(!byC.has(r[3])) byC.set(r[3], []); byC.get(r[3]).push(r); }
  const list = [...byC.entries()].map(([ci,rs])=>({ci, cur:yearTotal(rs,Y,w), prev:yearTotal(rs,P,w), yrs:S.years.map(y=>monthly(rs,y).reduce((a,b)=>a+b,0))})).filter(x=>x.cur||x.prev).sort((a,b)=>b.cur-a.cur);
  const tot = list.reduce((a,x)=>a+x.cur,0);
  h += `<div class="card"><h2>Rynki ${Y}${winLabel()} vs ${P}</h2><p class="note">${metricName()} · 15 największych rynków w ${Y}</p>${legendHTML([{label:String(P),color:yearColor(P),box:true},{label:String(Y),color:yearColor(Y),box:true}])}<div class="chart tall" id="ch-ctry"><canvas></canvas></div></div>`;
  h += `<div class="card"><h2>Wszystkie rynki</h2><p class="note">${metricName()} · posortowane wg ${Y}; r/r i udział liczone${winLabel()}</p><div class="tbl"><table><thead><tr><th>Kraj</th>${S.years.map(y=>`<th>${y}</th>`).join("")}<th>r/r ${Y}</th><th>Udział ${Y}</th></tr></thead><tbody>`;
  for(const x of list){ h += `<tr class="clk" data-ci="${x.ci}"><td>${esc(D.countries[x.ci])}</td>${x.yrs.map(v=>`<td>${fmt(v)}</td>`).join("")}${yoyCell(yoy(x.cur,x.prev))}<td>${tot?(x.cur/tot*100).toFixed(1).replace(".",",")+"%":"–"}</td></tr>`; }
  h += `</tbody></table></div></div>`;
  return {html:h, after:()=>{ bindMainYear();
    const top=list.slice(0,15); const o=baseOpts({indexAxis:"y"}); o.scales={ y:{grid:{display:false},border:{color:cssv("--line")},ticks:{color:cssv("--muted")}}, x:{grid:{color:cssv("--grid")},border:{display:false},beginAtZero:true,ticks:{color:cssv("--muted"),callback:o.scales.y.ticks.callback}} };
    o.plugins.tooltip.callbacks.label=(c)=>` ${c.dataset.label}: ${fmt(c.parsed.x)}`;
    mkChart(document.getElementById("ch-ctry"), {type:"bar", data:{labels:top.map(x=>D.countries[x.ci]), datasets:[barDs(String(P), top.map(x=>x.prev), yearColor(P)), barDs(String(Y), top.map(x=>x.cur), yearColor(Y))]}, options:o});
    document.querySelectorAll("tr.clk").forEach(tr=>tr.onclick=()=>{ S.country=+tr.dataset.ci; S.tab="overview"; render(); window.scrollTo({top:0}); });
  }};
}

function viewRefurb(rows){
  const Y=S.mainYear, P=Y-1, w=win(Y);
  const autos = rows.filter(r=>/Enbio S|Enbio PRO|Enbio Beauty|Refurb/.test(D.products[r[4]]));
  const newR = autos.filter(r=>!isRefurb(D.products[r[4]])), refR = autos.filter(r=>isRefurb(D.products[r[4]]));
  let h = `<div class="frow" style="justify-content:space-between">${mainYearSelect()}<span class="note" style="margin:0">Refurb = indeksy 1169409A/1169413A/1169415A, oznaczenie „X” lub „Refurbished” w linii faktury (produkty Refurb S / PRO / Beauty). ${partialNote()}</span></div>`;
  const nc=yearTotal(newR,Y,w), np=yearTotal(newR,P,w), rc=yearTotal(refR,Y,w), rp=yearTotal(refR,P,w);
  h += `<div class="tiles"><div class="tile"><div class="l">Nowe autoklawy ${Y}${winLabel()}</div><div class="v">${fmtC(nc)}</div><div class="d"><span class="${nc>=np?'up':'down'}">${fmtPct(yoy(nc,np))}</span> vs ${fmtC(np)} w ${P}</div></div>
    <div class="tile"><div class="l">Refurb ${Y}${winLabel()}</div><div class="v">${fmtC(rc)}</div><div class="d"><span class="${rc>=rp?'up':'down'}">${fmtPct(yoy(rc,rp))}</span> vs ${fmtC(rp)} w ${P}</div></div>
    <div class="tile"><div class="l">Udział refurb ${Y}</div><div class="v">${(nc+rc)?(rc/(nc+rc)*100).toFixed(1).replace(".",",")+"%":"–"}</div><div class="d">w ${P}: ${(np+rp)?(rp/(np+rp)*100).toFixed(1).replace(".",",")+"%":"–"}</div></div></div>`;
  h += `<div class="card"><h2>Nowe vs refurb wg lat</h2><p class="note">${metricName()} · autoklawy (Enbio S, PRO, Beauty i ich wersje refurb)</p>${legendHTML([{label:"Nowe",color:cssv("--c1"),box:true},{label:"Refurb",color:cssv("--c3"),box:true}])}<div class="chart" id="ch-ref-y"><canvas></canvas></div></div>`;
  h += `<div class="card"><h2>Refurb miesięcznie</h2><p class="note">${metricName()} · linia = rok</p>${legendHTML(S.years.map(y=>({label:String(y),color:yearColor(y)})))}<div class="chart" id="ch-ref-m"><canvas></canvas></div></div>`;
  h += `<div class="card"><h2>Rodzina produktu: nowe vs refurb</h2><p class="note">${metricName()} · ${Y}${winLabel()} vs ${P}</p><div class="tbl"><table><thead><tr><th>Rodzina</th><th>Nowe ${P}</th><th>Nowe ${Y}</th><th>r/r</th><th>Refurb ${P}</th><th>Refurb ${Y}</th><th>r/r</th><th>Udział refurb ${Y}</th></tr></thead><tbody>`;
  for(const f of ["S","PRO","Beauty"]){ const n=newR.filter(r=>family(D.products[r[4]])===f), rf=refR.filter(r=>family(D.products[r[4]])===f); const a=yearTotal(n,P,w),b=yearTotal(n,Y,w),c=yearTotal(rf,P,w),d=yearTotal(rf,Y,w);
    h += `<tr><td>Enbio ${f}</td><td>${fmt(a)}</td><td>${fmt(b)}</td>${yoyCell(yoy(b,a))}<td>${fmt(c)}</td><td>${fmt(d)}</td>${yoyCell(yoy(d,c))}<td>${(b+d)?(d/(b+d)*100).toFixed(1).replace(".",",")+"%":"–"}</td></tr>`; }
  h += `</tbody></table></div></div>`;
  return {html:h, after:()=>{ bindMainYear();
    const o=baseOpts(); o.scales.x.stacked=true; o.scales.y.stacked=true;
    mkChart(document.getElementById("ch-ref-y"), {type:"bar", data:{labels:YEARS.map(y=>y===CUR_Y?y+" YTD":String(y)), datasets:[barDs("Nowe",YEARS.map(y=>monthly(newR,y).reduce((a,b)=>a+b,0)),cssv("--c1"),"s"), barDs("Refurb",YEARS.map(y=>monthly(refR,y).reduce((a,b)=>a+b,0)),cssv("--c3"),"s")]}, options:o});
    mkChart(document.getElementById("ch-ref-m"), {type:"line", data:{labels:MON, datasets:S.years.map(y=>lineDs(String(y), monthly(refR,y).map((v,i)=>(y>CUR_Y||(y===CUR_Y&&i+1>CUR_M))?null:v), yearColor(y), y===Y))}, options:baseOpts()});
  }};
}

function viewPlan(rows){
  const NY = CUR_Y+1, base = CUR_Y, prevFull = CUR_Y-1;
  let plan={}; try{ plan=JSON.parse(localStorage.getItem("enbio-plan-"+NY)||"{}"); }catch(e){}
  const prods = D.products.map((p,i)=>i).filter(i=>S.prod.has(i));
  const w = LAST_FULL_M;
  let h = `<div class="card"><h2>Założenia planu ${NY}</h2><p class="note">${metricName()} · dla aktywnych filtrów (spółka / kraj / kanał). Prognoza ${base}: YTD do ${MONL[w-1]} + pozostałe miesiące wg udziału tych miesięcy w ${prevFull} (sezonowość). Wzrost % wpisz sam; domyślnie = dynamika r/r YTD. Rozkład miesięczny ${NY} według sezonowości ${prevFull}. Wpisane wartości zapisują się w tej przeglądarce.</p>
    <div class="plan-actions"><button class="btn" id="plan-reset">Przywróć domyślne wzrosty</button><label style="font-size:12.5px;color:var(--fg2)">Wzrost dla wszystkich: <input class="g" type="number" id="plan-all" step="1" placeholder="%"> <button class="btn" id="plan-apply">Zastosuj</button></label></div>
    <div class="tbl"><table><thead><tr><th>Produkt</th><th>${prevFull}</th><th>${base} YTD (I–${w})</th><th>r/r YTD</th><th>Prognoza ${base}</th><th>Wzrost ${NY} %</th><th>Plan ${NY}</th><th>vs prognoza ${base}</th></tr></thead><tbody>`;
  const calc = prods.map(pi=>{ const pr=rows.filter(r=>r[4]===pi); const prevM=monthly(pr,prevFull), curM=monthly(pr,base); const prevY=prevM.reduce((a,b)=>a+b,0), ytd=sumTo(curM,w), ytdPrev=sumTo(prevM,w);
    const restShare = prevY? (prevY-ytdPrev)/prevY : 0; const fc = ytdPrev? ytd/ytdPrev*prevY : ytd/Math.max(w,1)*12; const g = yoy(ytd,ytdPrev); const gDef = g==null? 0 : Math.round(Math.max(-50,Math.min(100,g)));
    const gIn = (plan[D.products[pi]]!=null)? plan[D.products[pi]] : gDef; const target = fc*(1+gIn/100); return {pi, prevY, ytd, ytdPrev, fc, g, gDef, gIn, target, prevM}; });
  let tPrev=0,tY=0,tYP=0,tF=0,tT=0;
  for(const c of calc){ tPrev+=c.prevY; tY+=c.ytd; tYP+=c.ytdPrev; tF+=c.fc; tT+=c.target;
    h += `<tr><td>${esc(D.products[c.pi])}</td><td>${fmt(c.prevY)}</td><td>${fmt(c.ytd)}</td>${yoyCell(c.g)}<td>${fmt(Math.round(c.fc))}</td><td><input class="g" type="number" step="1" data-pi="${c.pi}" value="${c.gIn}"></td><td><b>${fmt(Math.round(c.target))}</b></td>${yoyCell(yoy(c.target,c.fc))}</tr>`; }
  h += `<tr class="tot"><td>Suma</td><td>${fmt(tPrev)}</td><td>${fmt(tY)}</td>${yoyCell(yoy(tY,tYP))}<td>${fmt(Math.round(tF))}</td><td>${tF? fmtPct(yoy(tT,tF)) : "–"}</td><td>${fmt(Math.round(tT))}</td>${yoyCell(yoy(tT,tF))}</tr></tbody></table></div></div>`;
  // monthly split
  h += `<div class="card"><h2>Plan ${NY} w rozkładzie miesięcznym</h2><p class="note">${metricName()} · sezonowość z ${prevFull} (produkty z małą historią, poniżej 50 szt., dostają sezonowość całej sprzedaży); ostatnia kolumna = realizacja ${base}</p>${legendHTML([{label:String(prevFull),color:yearColor(prevFull)},{label:String(base),color:yearColor(base)},{label:"Plan "+NY,color:cssv("--accent")}])}<div class="chart" id="ch-plan" style="margin-bottom:16px"><canvas></canvas></div><div class="tbl"><table><thead><tr><th>Miesiąc</th>${calc.map(c=>`<th>${esc(D.products[c.pi])}</th>`).join("")}<th>Razem ${NY}</th><th>${base}</th></tr></thead><tbody>`;
  const allPrevM = monthly(rows,prevFull); const allPrevS = allPrevM.reduce((a,b)=>a+b,0);
  const monthPlan = calc.map(c=>{ const s=c.prevM.reduce((a,b)=>a+b,0); const useOwn = s>=50 && c.prevM.every(v=>v>=0); const base = useOwn? c.prevM : allPrevM; const bs = useOwn? s : allPrevS; return base.map(v=> bs? c.target*v/bs : c.target/12); });
  const totalPlanM = new Array(12).fill(0); monthPlan.forEach(mp=>mp.forEach((v,i)=>totalPlanM[i]+=v));
  const curTot = monthly(rows,base), prevTot = monthly(rows,prevFull);
  for(let m=0;m<12;m++){ h += `<tr><td>${MONL[m]}</td>${monthPlan.map(mp=>`<td>${fmt(Math.round(mp[m]))}</td>`).join("")}<td><b>${fmt(Math.round(totalPlanM[m]))}</b></td><td class="dim">${m+1<=CUR_M? fmt(curTot[m]) : "–"}</td></tr>`; }
  h += `<tr class="tot"><td>Suma</td>${monthPlan.map(mp=>`<td>${fmt(Math.round(mp.reduce((a,b)=>a+b,0)))}</td>`).join("")}<td>${fmt(Math.round(tT))}</td><td class="dim">${fmt(curTot.reduce((a,b)=>a+b,0))}</td></tr></tbody></table></div></div>`;
  return {html:h, after:()=>{
    const save=()=>{ try{ localStorage.setItem("enbio-plan-"+NY, JSON.stringify(plan)); }catch(e){} };
    document.querySelectorAll("input.g[data-pi]").forEach(inp=>inp.onchange=()=>{ plan[D.products[+inp.dataset.pi]] = +inp.value; save(); render(); });
    document.getElementById("plan-reset").onclick=()=>{ plan={}; save(); render(); };
    document.getElementById("plan-apply").onclick=()=>{ const v=+document.getElementById("plan-all").value; if(!isFinite(v)) return; prods.forEach(pi=>plan[D.products[pi]]=v); save(); render(); };
    mkChart(document.getElementById("ch-plan"), {type:"line", data:{labels:MON, datasets:[lineDs(String(prevFull), prevTot, yearColor(prevFull)), lineDs(String(base), curTot.map((v,i)=>i+1>CUR_M?null:v), yearColor(base)), Object.assign(lineDs("Plan "+NY, totalPlanM.map(Math.round), cssv("--accent"), true), {borderDash:[6,4]})]}, options:baseOpts()});
  }};
}

// ---------- render ----------
function render(){
  syncFilterUI();
  try{ localStorage.setItem("enbio-dash-state", JSON.stringify({tab:S.tab, metric:S.metric})); }catch(e){}
  destroyCharts();
  const rows = slice();
  const v = ({overview:viewOverview, products:viewProducts, companies:viewCompanies, countries:viewCountries, refurb:viewRefurb, plan:viewPlan})[S.tab](rows);
  const el=document.getElementById("view"); el.innerHTML=v.html; v.after();
  document.getElementById("foot").textContent = `Źródło: wyciąg analityczny faktur (ODOO, AX, FILE, MONITOR), ${D.rows.length} zagregowanych linii, zakres ${YEARS[0]}–${D.maxDate}. Wartości netto po kursie z faktury; korekty i zwroty (ujemne ilości) są wliczone, więc liczby są netto. Sztuki Magic Filter i Water bottles set to akcesoria („Other products”) – w analizach autoklawów są pomijane. Kliknięcie chipa z Alt/Ctrl wybiera tylko tę pozycję.`;
}
buildFilters();
render();
const mq = window.matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change", ()=>{ buildFilters(); render(); });
new MutationObserver(()=>{ buildFilters(); render(); }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
</script>
